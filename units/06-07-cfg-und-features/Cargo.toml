# Deutsch: Das Feature dieser Einheit. Es ist standardmäßig aus, und deshalb
# baut jeder Befehl aus CONTRIBUTING.md die Fassung ohne es. Mit ihm gebaut wird
# über `cargo test --features zusammenfassung`, und das steht in der README.
# English: the feature of this unit. It is off by default, and every command from
# CONTRIBUTING.md therefore builds the version without it. Building with it goes
# through `cargo test --features zusammenfassung`, and that stands in the README.
[features]
default = []
zusammenfassung = []
